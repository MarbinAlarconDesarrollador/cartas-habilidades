<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SUPER STUM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17304a"/>
      <stop offset=".55" stop-color="#0d4f91"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c900"/>
      <stop offset="1" stop-color="#d2b300"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".65">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- hexÃ¡gono central (ficha del juego) -->
  <polygon points="256,86 416,178.5 416,363.5 256,456 96,363.5 96,178.5"
           fill="url(#hexFill)" stroke="#0a0e13" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="256,116 390,193.5 390,348.5 256,426 122,348.5 122,193.5"
           fill="none" stroke="#083766" stroke-width="8" stroke-linejoin="round" opacity=".9"/>

  <!-- monograma -->
  <text x="256" y="316" text-anchor="middle" fill="#083766"
        font-family="'Rajdhani','Arial Black',Arial,sans-serif"
        font-size="168" font-weight="700" letter-spacing="4">SS</text>

  <!-- estrella superior: toque de "sÃºper" -->
  <path d="M256 148l10.5 21.5 23.5 3.5-17 16.5 4 23.5-21-11-21 11 4-23.5-17-16.5 23.5-3.5z"
        fill="#081521" opacity=".85"/>
</svg>